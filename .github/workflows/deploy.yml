name: Update CAPE Dashboard

on:
  schedule:
    # Runs at market close Mon–Fri at 21:30 UTC (4:30 PM ET / after close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "fetch_cape.py"
      - "index.html"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"

permissions:
  contents: write   # needed to push to gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Fetch live CAPE + SP500 data
        run: |
          uv run fetch_cape.py

      - name: Verify data.json was created
        run: |
          echo "=== data.json ==="
          cat data.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          # Only publish these files, source files not needed
          include_files: |
            index.html
            data.json
