name: Update CAPE Dashboard

on:
  schedule:
    # Runs at market close Mon–Fri at 21:30 UTC (4:30 PM ET / after close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "fetch_cape.py"
      - "index.html"
      - ".github/workflows/deploy.yml"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Fetch live CAPE + SP500 data
        run: uv run fetch_cape.py

      - name: Verify data.json was created
        run: cat data.json

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html data.json _site/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
