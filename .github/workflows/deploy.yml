name: Update CAPE Dashboard

on:
  schedule:
    # Runs at market close Mon–Fri at 21:30 UTC (4:30 PM ET / after close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "fetch_cape.py"
      - "index.html"
      - ".github/workflows/deploy.yml"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      - name: Fetch live CAPE + SP500 data
        run: uv run fetch_cape.py

      - name: Verify data.json was created
        run: cat data.json

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html data.json _site/

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
